# ============================================================================
# ais3-ctf6 — 記憶消融實驗 (memory ablation) 對照組設定
#
# 假設 (H1): 共享白板降低主腦 (Claude) 的 token 消耗。
# 反假設 (H0): 注入白板只是把成本從「重新探索」換成「每輪注入」，淨值不變或更差。
#
# 這份 config 釘住所有應該固定的變因，只留 memory_policy 與 session 兩個自變數。
# 規劃書 §19.2 (四檔記憶) 與 §15 (session 模式) 是本實驗的來源。
# ============================================================================

meta:
  name: memory-ablation-v1
  # 實驗必須綁在一個確定的程式碼狀態上，否則跨 arm 的數字不可比。
  repo: SilverfishEpic/ais3-ctf6
  commit: f412fbbecd44d6886027ce36f11a507a342cb41e   # main, worktree clean
  python: "3.14.4"        # WSL .venv-linux（Windows 上 47 個 async 測試會自爆，勿用）
  platform: WSL2 / Ubuntu
  created: 2026-07-30

# ----------------------------------------------------------------------------
# 固定變因 —— 所有 arm 共用，任一項改動都使先前資料失效
# ----------------------------------------------------------------------------
fixed:
  memory_core:
    host: 127.0.0.1
    port: 8777
    runs_dir: ./runs
    templates_dir: ./templates
    template_versions: {crypto: 1, generic: 1, pwn: 1, rev: 1, web: 1}
    summarizer: ais3                       # 真 summarizer，不是 --fake-summarizer
    model: ais3/nemotron-3-ultra-550b
    base_url: https://llm-api.zoolab.org/v1
    timeout: 300
    # 注意：Memory Core 是單寫者。arm 之間必須序列執行，不可並行。
    workers: 1

  agent:
    provider: claude
    model: null              # null = 用 SDK 預設；一旦要發表數字就必須釘死
    mode: normal             # yolo 會被 Claude Code 的 auto-mode classifier 擋掉
    max_turns: 6             # 固定輪數預算，見 design.termination
    max_cost_usd: 3.0        # 安全閘，不是終止條件；觸發即該 run 作廢
    idle_turns: 99           # 關掉「白板沒動就停」，否則 no_memory 檔會提早結束造成偏差

  guessing:
    guess_seed: 20260730     # policy.py：種子讓 ablation 可重現。四檔必須同種子。
    guess_count: 3

  prompt: |
    Solve the CTF challenge in this workspace and recover the flag.
    Inspect the provided files, work out the vulnerability, write and run a solver,
    and report the flag.
  # 逐字固定。第二輪起 loop.py 會自行改送「根據白板的最新異動繼續。」——
  # 這是 same-session 的機制，不要覆寫。

  workspace:
    # 從 test-challenge-set 複製「發給選手的檔案」，solution/ 一律排除。
    exclude: [solution]
    # 每個 arm × 每次重複都用全新的 workspace 副本，避免上一輪的產物洩漏。
    fresh_per_run: true

# ----------------------------------------------------------------------------
# 自變數
# ----------------------------------------------------------------------------
factors:
  memory_policy:            # agent_bridge/policy.py ABLATION_LEVELS
    - none_at_all           # ← 見 baseline_arm：完全不接記憶系統的純 Claude Code
    - no_memory             # 仍跑在 agent_bridge loop 裡，只是不注入白板
    - fact_only
    - fact_and_assumption
    - full                  # fact + assumption + guessing
  session:                  # policy.py SessionMode
    - new                   # 每輪重開，無對話歷史 → 逼出「靠記憶重建 vs 從零重探」
    - same                  # 延續同一 session，白板走 diff 增量

# ----------------------------------------------------------------------------
# 真對照組：完全不接記憶系統的 Claude Code
#
# 為什麼需要它：--memory-policy no_memory 仍然跑在 agent_bridge 的 loop 裡，
# 仍被 loop 改寫第二輪起的 prompt、仍受 idle/turn 機制影響。要隔離「記憶系統的
# 淨貢獻」，對照組必須完全不經過這套系統。
#
# 額外好處：claude -p --output-format json 直接回傳完整 token 明細
# （input / output / cache_creation / cache_read / 逐模型 costUSD），
# 正是專題自己在 envelope.py 丟掉的那筆資料。對照組的儀器比受測系統完整。
# ----------------------------------------------------------------------------
baseline_arm:
  runner: claude
  cli_version: "2.1.220"
  invocation: |
    cd <workspace> && claude -p "<fixed.prompt>" \
      --output-format json \
      --disallowed-tools WebSearch WebFetch \
      --allowed-tools "Bash(javap:*)" "Bash(java:*)" "Bash(python:*)" \
                      "Bash(xxd:*)" "Bash(od:*)" "Bash(strings:*)" "Bash(file:*)" \
                      Read Write Edit Glob Grep \
      --max-budget-usd 2 \
      --permission-mode acceptEdits < /dev/null

  # 這個 CLI 版本沒有 --max-turns，只有 --max-budget-usd。
  # 因此跨 arm 的預算對齊必須用金額，不能用輪數。
  budget_control: max-budget-usd

  must_disable:
    - WebSearch
    - WebFetch
  # 理由：SekaiCTF 的 writeup 全部公開在 github.com/project-sekai-ctf。
  # 不關掉的話對照組可以直接查答案，整個實驗作廢。

  must_grant:
    # 題目需要的解譯器必須明確授權，否則量到的是沙箱不是記憶系統。見 confounds。
    rev: [javap, java, python, xxd, od, strings, file]
    crypto: [python]
    # 已知漏洞：範圍化 allowlist 不涵蓋 `cd X && (...)`、`VAR=... cmd` 這類組合形式，
    # 實測仍會有零星 denial。收數據時必須檢查 permission_denials 長度。

# ----------------------------------------------------------------------------
# 已實測的對照組基準值（rev/SekaiCTF2022-matrix-lab-1，2026-07-30）
# 兩次都解出正確 flag SEKAI{m4tr1x_d3cryP710N_15_Fun_M4T3_@2D2D!}
# ----------------------------------------------------------------------------
baseline_reference:
  challenge: rev/SekaiCTF2022-matrix-lab-1
  runs:
    - id: run1
      valid: false            # 沙箱擋掉所有解譯器，數據作廢
      permission_denials: 10
      turns: 18
      seconds: 441
      input_tokens: 30
      output_tokens: 39342
      cache_creation_tokens: 59142
      cache_read_tokens: 569835
      cost_usd: 1.8607
      solved: true
      note: 被迫從 hex dump 手工重建 bytecode、手算逆矩陣，未執行任何程式

    - id: run2
      valid: true             # ← 這是對照組基準
      permission_denials: 2   # 僅 shell 組合形式，不影響解題
      turns: 11
      seconds: 94
      input_tokens: 22
      output_tokens: 5895
      cache_creation_tokens: 20855
      cache_read_tokens: 325049
      cost_usd: 0.5192
      solved: true
      note: 寫出並實際執行 solve.py，內含 forward re-check（forward check: True）

  inflation_from_sandboxing: 3.6x     # cost 1.8607 / 0.5192；output tokens 6.7x

# ----------------------------------------------------------------------------
# 應變數（要記錄什麼）
# ----------------------------------------------------------------------------
measurements:
  available_today:
    - total_cost_usd        # agent-status.json
    - turns
    - productive_turns      # 白板真的有變動的輪數
    - last_revision
    - stopped_because
    - board_items           # 收工時白板上的 fact/assumption 筆數
    - injected_chars        # 離線可算：render_board / render_diff 的長度

  blocked:                  # 必須先補 instrumentation，見 blockers
    - agent_input_tokens
    - agent_output_tokens
    - agent_cache_read_tokens
    - agent_cache_creation_tokens
    - per_turn_breakdown
    - summarizer_tokens     # Memory Core 打給 550b 的帳，目前完全沒記

  derived:
    # H1 的判準：主腦總 token，而不是總金額（有 caching 之後兩者脫鉤）
    - name: agent_total_tokens
      formula: input + output          # cache_read 另計，不可混入
    - name: tokens_per_productive_turn
      formula: agent_total_tokens / productive_turns
    - name: memory_overhead_tokens
      formula: sum(injected_chars) / 4  # 記憶自己的成本，要從節省裡扣掉

# ----------------------------------------------------------------------------
# 題目子集
# ----------------------------------------------------------------------------
challenges:
  # 挑選原則：離線可分析（不需要起服務），且有真 ground-truth flag。
  # 全 20 題會讓 cell 數爆掉，先用 5 題建立訊號。
  primary:
    - path: rev/SekaiCTF2022-matrix-lab-1        # rev/easy，.class，離線
      flag: SEKAI{m4tr1x_d3cryP710N_15_Fun_M4T3_@2D2D!}
    - path: crypto/SekaiCTF2024-squares-vs-cubes # crypto/insane，dist only
      flag: "SEKAI{this_challenge_was_originally_called_oblivion_...}"  # 需補全
    - path: rev/SekaiCTF2026-untitled-encore     # rev/medium，eBPF
      flag: SEKAI{eBPF_my_B3l0v3d}
    - path: rev/SekaiCTF2024-sekai-licensing     # rev/master，有 pcapng
      flag: SEKAI{m1ku_l0ves_cpu1d_and_ku3r_shar3d_data}
    - path: web/SekaiCTF2022-sekai-game-start    # web/medium
      flag: SEKAI{W3lcome_T0_Our_universe}

  # 不可用作 solve oracle 的題目，別誤用：
  no_ground_truth: [crypto/SekaiCTF2025-ssss, rev/SekaiCTF2025-miku-music-machine,
                    rev/SekaiCTF2023-sahuang-flag-checker, web/SekaiCTF2024-lookup]
  placeholder_flag_only: [crypto/SekaiCTF2026-iihash, pwn/SekaiCTF2026-echo-chamber,
                          pwn/SekaiCTF2025-vkfs, web/SekaiCTF2026-migurimental,
                          web/SekaiCTF2025-rednote, web/SekaiCTF2023-leakless-note]
  # ↑ 這 6 題 repo 裡只有 SEKAI{dummy_flag} / SEKAI{test_flag}，不是真 flag。

# ----------------------------------------------------------------------------
# 實驗設計
# ----------------------------------------------------------------------------
design:
  # LLM 不決定性很高，單次執行不能下結論。
  repetitions: 3

  termination:
    kind: fixed_turn_budget
    turns: 6
    # 為什麼不用「解出就停」：20 題裡多數是互動式題目，離線根本拿不到 flag，
    # 只能推導方法。固定輪數讓各 arm 花費可比，並用 progress 抓「便宜只是因為做得少」。
    rationale: equal-budget comparison

  outcomes:
    primary: agent_total_tokens        # H1 的直接判準
    secondary:
      - solved                         # flag 是否出現在白板或 agent 輸出
      - progress_score                 # 白板是否觸及官方 writeup 的關鍵洞察（需評分）
    guard: |
      任何「較省 token」的結論，必須同時附上 progress。
      省下的 token 若來自做得更少，那不是 H1 成立。

  staging:
    # 直接跑滿 4×2×5×3 = 120 runs 不理性。分階段：
    stage_0_pilot:
      arms: [{policy: no_memory, session: new}, {policy: full, session: new}]
      challenges: 2
      repetitions: 2
      runs: 8
      goal: 驗證 harness、取得單次執行的實際成本，再決定是否放大
    stage_1_extremes:
      arms: [{policy: no_memory, session: new}, {policy: full, session: new}]
      challenges: 5
      repetitions: 3
      runs: 30
      goal: 先確認效應存在。兩端沒差異就不必補中間兩檔。
    stage_2_full:
      arms: 4 policies x [new]
      challenges: 5
      repetitions: 3
      runs: 60
    stage_3_session:
      arms: 4 policies x [same]
      challenges: 5
      repetitions: 3
      runs: 60

# ----------------------------------------------------------------------------
# 已知混淆與設計張力 —— 讀數字前務必知道
# ----------------------------------------------------------------------------
confounds:
  - id: tool-surface-differs
    detail: |
      no_memory 檔不只是「沒有白板」——policy.py 的 skill_enabled=False 讓 memory_* 工具
      完全不註冊。所以那一檔的工具介面和其他三檔不同。就消融實驗而言這是正確的
      （否則 agent 仍能自己查白板），但不能說成「唯一差異是記憶層數」。

  - id: diff-vs-session-mutually-exclusive
    detail: |
      省 token 的機制是 diff_after_first_turn（第一輪整份、之後只給 diff），
      但 SessionMode.effective() 在 session=new 時會強制關掉它。
      也就是最能展示價值的情境（new session，無對話歷史）恰好用不到那個機制。
      跑 stage_3 前先跟隊友確認這是不是有意的設計。

  - id: prompt-rewritten-after-turn-1
    detail: loop.py 第二輪起改送「根據白板的最新異動繼續。」——no_memory 檔沒有 diff 可依據，
            這使兩檔的第 2 輪起輸入本質不同，不只是少了白板。

  - id: summarizer-cost-not-in-the-ledger
    detail: |
      白板要靠 550b summarizer 產生。已量到 classify 固定開銷佔 76%（每次重送
      templates JSON），summarize 每次還有 2,605 chars 常數 prompt。
      若只比主腦 token，記憶系統的真實總成本會被低估。

  - id: no-prompt-cache-accounting
    detail: 有 caching 時金額與 token 脫鉤（cache read 便宜約 10 倍）。
            沒有 cache_read/creation 拆分，total_cost_usd 無法回推 token。

  - id: campus-network
    detail: 只跑 localhost 與 AIS3 課程 gateway，不對外部題目服務發流量。

  - id: sandbox-denials-inflate-baseline
    severity: critical
    measured: true
    detail: |
      實測：同一題、同一預算，只差在工具是否授權——
        沙箱版  10 denials, 39,342 output tokens, $1.8607, 18 turns, 441s
        授權版   2 denials,  5,895 output tokens, $0.5192, 11 turns,  94s
      成本膨脹 3.6 倍、output token 膨脹 6.7 倍，兩次都解出正確 flag。
      偏差方向對記憶系統「有利」：對照組若被沙箱限制，記憶系統會看起來省了 72%，
      而那個差異其實 100% 來自工具可用性。
      → 收數據時必須把 permission_denials 當一等公民記錄，非零就標記該 run 可疑。

  - id: cache-prefix-position
    severity: critical
    measured: true
    detail: |
      實測對照組：input_tokens=22，cache_read_input_tokens=325,049。
      主腦的輸入幾乎 100% 走 prompt cache。
      所以白板注入的真實成本不等於 injected_chars：
        - 若注入內容落在穩定前綴內 → 走 cache read，帳上幾乎免費
        - 若每輪變動（diff 正是每輪都不同）→ 破壞 cache 前綴，代價遠超其自身長度
      → 判讀時必須看 cache_creation 的變化，不能只比 input+output 總量。
      → 這也意味著 diff_after_first_turn 可能反而更貴，與設計直覺相反，必須實測。

  - id: environment-must-match
    severity: high
    detail: |
      對照組目前在 Windows 側跑（Claude Code 已認證），受測系統只能在 WSL 跑
      （Windows venv 缺 fastapi 等依賴，Memory Core 起不來）。
      兩側工具鏈不同（Windows 有 jdk-21 但沒有 WSL 的 CTF 工具鏈）。
      → 最終配對實驗必須兩個 arm 在同一環境。等 WSL 登入後兩側都在 WSL 跑。

# ----------------------------------------------------------------------------
# 執行前必須清除的阻礙
# ----------------------------------------------------------------------------
blockers:
  - id: agent-not-authenticated
    status: OPEN
    owner: Ronny
    detail: |
      WSL 的 claude 解析到 Windows npm shim（/mnt/c/Users/Ronny/AppData/Roaming/npm/claude），
      但 WSL 的 HOME 是 Linux 家目錄，看不到 /mnt/c/Users/Ronny/.claude/.credentials.json，
      因此回 "Not logged in · Please run /login"。必須在 WSL 側登入。
      未修前 --provider claude 的每次執行都是 0 token 的假成功。

  - id: token-usage-dropped
    status: OPEN
    detail: |
      normalize.py:338 的 _build_run_meta 會收 usage/subtype/is_error，
      但 envelope.py 明確把 run_meta 排除在線上契約外（「只留在本地當 loop telemetry」），
      而 runtime.py 的 AgentStatus 只存 total_cost_usd，沒有 token 拆分。
      → 補法：AgentStatus 增加 input/output/cache token 欄位，逐輪累加後寫入
        agent-status.json；Memory Core 端在 ais3.py 的 _chat 讀 response["usage"]。
      這是 measurements.blocked 全部項目的唯一前置。

  - id: provider-failure-poisons-board
    status: OPEN
    detail: |
      provider 掛掉時錯誤字串會被當正常輸出 ingest，經 summarizer 加工成署名 agent 的
      假假設寫入白板（實測：「Not logged in」→ A001「題目需要先認證」）。
      實驗期間若發生，該 arm 的資料無效且白板已污染。
      建議先讓 loop 在 run_meta.is_error 或 model == "<synthetic>" 時中止且不 ingest。

# ----------------------------------------------------------------------------
# 執行程序
# ----------------------------------------------------------------------------
procedure:
  - 每個 (challenge, policy, session, rep) 建立獨立 challenge id：
      ablate-{policy}-{session}-r{rep}-{challenge-slug}
  - 每次執行前重建 workspace 副本（fresh_per_run），solution/ 排除
  - Memory Core 單寫者：所有 run 序列執行
  - 每次執行後歸檔 runs/{id}/state.yaml + journal.jsonl + agent-status.json
  - 記錄 injected_chars：對每一輪的實際注入文字量測，不要事後用平均估
  - arm 之間不重用 challenge board。重用會讓前一 arm 的記憶洩漏到後一 arm。
