          - type: string
          - type: 'null'
          title: Description
      additionalProperties: false
      type: object
      required:
      - id
      - title
      title: GuessingTechnique
      description: One curated technique.  IDs are stable within a template version.
    GuessingTechniqueState:
      properties:
        tried:
          type: boolean
          title: Tried
          default: false
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
      additionalProperties: false
      type: object
      title: GuessingTechniqueState
    IngestEnvelope:
      properties:
        source:
          $ref: '#/components/schemas/InputSource'
        input:
          oneOf:
          - $ref: '#/components/schemas/NoteInput'
          - $ref: '#/components/schemas/CommandResultInput'
          - $ref: '#/components/schemas/RunLogInput'
          title: Input
          discriminator:
            propertyName: type
            mapping:
              command_result: '#/components/schemas/CommandResultInput'
              note: '#/components/schemas/NoteInput'
              run_log: '#/components/schemas/RunLogInput'
      additionalProperties: false
      type: object
      required:
      - source
      - input
      title: IngestEnvelope
      description: The one and only ingest contract, shared by humans and agents.
    IngestResponse:
      properties:
        revision_before:
          type: integer
          title: Revision Before
        revision_after:
          type: integer
          title: Revision After
        summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary
        diff:
          $ref: '#/components/schemas/MemoryDiff'
        source_id:
          type: string
          title: Source Id
          description: Journal ID of the record just appended.
      additionalProperties: false
      type: object
      required:
      - revision_before
      - revision_after
      - diff
      - source_id
      title: IngestResponse
    InputSource:
      properties:
        type:
          type: string
          enum:
          - human
          - agent
          title: Type
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
          description: Human username, when type=human.
        provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
          description: e.g. "anthropic", when type=agent.
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Id
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
      additionalProperties: false
      type: object
      required:
      - type
      title: InputSource
      description: 'Who produced an input.


        Vendor-neutral on purpose.  Claude SDK objects are normalized into this shape by

        the Agent Bridge (Person 3) *before* they reach Memory Core; provider-specific

        classes never become part of the domain model.'
    MarkTriedOperation:
      properties:
        op:
          type: string
          const: mark_tried
          title: Op
          default: mark_tried
        technique:
          type: string
          title: Technique
        tried:
          type: boolean
          title: Tried
          default: true
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
      additionalProperties: false
      type: object
      required:
      - technique
      title: MarkTriedOperation
      description: 'Record that a Guessing technique has been attempted for this challenge.


        Beyond the six operations in the original brief, and deliberately so: ``state.yaml``

        stores per-challenge ``tried`` flags (設計規劃書 §4.3) and ``GuessRequest.only_untried``

        is meaningless without a sanctioned way to set them.  It is still a *controlled*

        operation over template-owned identifiers — it can flip a flag and attach a note, and

        it can neither add a technique to the catalog nor change its metadata.'
    MemoryDiff:
      properties:
        fact_added:
          items:
            type: string
          type: array
          title: Fact Added
        fact_updated:
          items:
            type: string
          type: array
          title: Fact Updated
        fact_removed:
          items:
            type: string
          type: array
          title: Fact Removed
        assumption_added:
          items:
            type: string
          type: array
          title: Assumption Added
        assumption_updated:
          items:
            type: string
          type: array
          title: Assumption Updated
        assumption_removed:
          items:
            type: string
          type: array
          title: Assumption Removed
        promoted:
          items:
            type: string
          type: array
          title: Promoted
        demoted:
          items:
            type: string
          type: array
          title: Demoted
        template_changed:
          anyOf:
          - $ref: '#/components/schemas/TemplateChange'
          - type: 'null'
      additionalProperties: false
      type: object
      title: MemoryDiff
    MemoryMutation:
      properties:
        expected_revision:
          type: integer
          minimum: 0.0
          title: Expected Revision
        actor:
          type: string
          title: Actor
        reason:
          type: string
          minLength: 1
          title: Reason
          description: 'Required: overrides must be attributable.'
        operations:
          items:
            oneOf:
            - $ref: '#/components/schemas/AddOperation'
            - $ref: '#/components/schemas/ReplaceOperation'
            - $ref: '#/components/schemas/RemoveOperation'
            - $ref: '#/components/schemas/PromoteOperation'
            - $ref: '#/components/schemas/DemoteOperation'
            - $ref: '#/components/schemas/MoveOperation'
            - $ref: '#/components/schemas/MarkTriedOperation'
            discriminator:
              propertyName: op
              mapping:
                add: '#/components/schemas/AddOperation'
                demote: '#/components/schemas/DemoteOperation'
                mark_tried: '#/components/schemas/MarkTriedOperation'
                move: '#/components/schemas/MoveOperation'
                promote: '#/components/schemas/PromoteOperation'
                remove: '#/components/schemas/RemoveOperation'
                replace: '#/components/schemas/ReplaceOperation'
          type: array
          minItems: 1
          title: Operations
      additionalProperties: false
      type: object
      required:
      - expected_revision
      - actor
      - reason
      - operations
      title: MemoryMutation
      description: Controlled human mutation.  There is deliberately no arbitrary YAML patch API.
    MemoryReadResponse:
      properties:
        revision:
          type: integer
          title: Revision
        challenge:
          $ref: '#/components/schemas/ChallengeMeta'
        fact:
          additionalProperties:
            items:
              $ref: '#/components/schemas/FactItem'
            type: array
          type: object
          title: Fact
        assumption:
          additionalProperties:
            items:
              $ref: '#/components/schemas/AssumptionItem'
            type: array
          type: object
          title: Assumption
        guessing:
          anyOf:
          - $ref: '#/components/schemas/GuessingState'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - revision
      - challenge
      title: MemoryReadResponse
    MoveOperation:
      properties:
        op:
          type: string
          const: move
          title: Op
          default: move
        id:
          type: string
          title: Id
        section:
          type: string
          title: Section
      additionalProperties: false
      type: object
      required:
      - id
      - section
      title: MoveOperation
      description: Change an item's section only.  Never changes its epistemic level.
    NoteInput:
      properties:
        type:
          type: string
          const: note
          title: Type
          default: note
        content:
          type: string
          title: Content
      additionalProperties: false
      type: object
      required:
      - content
      title: NoteInput
      description: Free-form human note.  Ordinary human hypotheses default to Assumption.
    PromoteOperation:
      properties:
        op:
          type: string
          const: promote
          title: Op
          default: promote
        id:
          type: string
          title: Id
        to:
          type: string
          const: fact
          title: To
          default: fact
        section:
          anyOf:
          - type: string
          - type: 'null'
          title: Section
      additionalProperties: false
      type: object
      required:
      - id
      title: PromoteOperation
      description: Assumption -> Fact.  This is the *only* sanctioned human override path.
    QueryRequest:
      properties:
        question:
          type: string
          minLength: 1
          title: Question
        layers:
          items:
            type: string
            enum:
            - fact
            - assumption
            - guessing
          type: array
          title: Layers
      additionalProperties: false
      type: object
      required:
      - question
      title: QueryRequest
    QueryResponse:
      properties:
        answer:
          type: string
          title: Answer
        references:
          items:
            type: string
          type: array
          title: References
        revision:
          type: integer
          title: Revision
      additionalProperties: false
      type: object
      required:
      - answer
      - revision
      title: QueryResponse
      description: 'Answers are grounded strictly in current whiteboard state.


        ``references`` is filtered against the live snapshot, so a hallucinated ID can never

        reach the client.'
    RemoveOperation:
      properties:
        op:
          type: string
          const: remove
          title: Op
          default: remove
        id:
          type: string
          title: Id
      additionalProperties: false
      type: object
      required:
      - id
      title: RemoveOperation
    ReplaceOperation:
      properties:
        op:
          type: string
          const: replace
          title: Op
          default: replace
        id:
          type: string
          title: Id
        text:
          type: string
          title: Text
        evidence:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Evidence
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
      additionalProperties: false
      type: object
      required:
      - id
      - text
      title: ReplaceOperation
    RunLogInput:
      properties:
        type:
          type: string
          const: run_log
          title: Type
          default: run_log
        events:
          items:
            $ref: '#/components/schemas/AgentRunEvent'
          type: array
          title: Events
      additionalProperties: false
      type: object
      required:
      - events
      title: RunLogInput
      description: Normalized external-agent run log.
    TemplateChange:
      properties:
        from:
          type: string
          title: From
        to:
          type: string
          title: To
      additionalProperties: false
      type: object
      required:
      - from
      - to
      title: TemplateChange
    TemplateChangeRequest:
      properties:
        template:
          type: string
          title: Template
        expected_revision:
          type: integer
          minimum: 0.0
          title: Expected Revision
        actor:
          type: string
          title: Actor
        reason:
          type: string
          minLength: 1
          title: Reason
      additionalProperties: false
      type: object
      required:
      - template
      - expected_revision
      - actor
      - reason
      title: TemplateChangeRequest
    TemplateListResponse:
      properties:
        templates:
          items:
            $ref: '#/components/schemas/TemplateSummary'
          type: array
          title: Templates
      additionalProperties: false
      type: object
      required:
      - templates
      title: TemplateListResponse
    TemplateSummary:
      properties:
        id:
          type: string
          pattern: ^[a-z0-9_-]+$
          title: Id
        version:
          type: integer
          minimum: 1.0
          title: Version
        catalog:
          type: string
          pattern: ^[a-z0-9_-]+@\d+$
          title: Catalog
        description:
          type: string
          title: Description
          default: ''
        fact_sections:
          items:
            type: string
          type: array
          title: Fact Sections
        assumption_sections:
          items:
            type: string
          type: array
          title: Assumption Sections
        guessing:
          items:
            $ref: '#/components/schemas/GuessingTechnique'
          type: array
          title: Guessing
      additionalProperties: false
      type: object
      required:
      - id
      - version
      - catalog
      - fact_sections
      - assumption_sections
      title: TemplateSummary
      description: 'Public template metadata exposed to clients.


        Clients need template ids for explicit reclassification and Guessing labels for

        rendering.  Memory Core still owns loading, validation, section remapping and the

        authoritative per-challenge guessing state.'
