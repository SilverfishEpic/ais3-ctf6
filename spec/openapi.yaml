          minimum: 1.0
          title: Seq
        role:
          type: string
          enum:
          - assistant
          - tool
          - user
          - system
          title: Role
        kind:
          type: string
          enum:
          - message
          - tool_call
          - tool_result
          title: Kind
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Tool name, for tool_call/tool_result.
        content:
          type: string
          title: Content
        outcome:
          anyOf:
          - type: string
            enum:
            - succeeded
            - failed
            - denied
            - interrupted
            - unknown
          - type: 'null'
          title: Outcome
          description: Execution provenance for tool_result. succeeded/failed mean the tool ran; denied/interrupted/unknown
            do not grant direct-evidence status. Omitted legacy tool_result events are treated as unknown.
      additionalProperties: false
      type: object
      required:
      - seq
      - role
      - kind
      - content
      title: AgentRunEvent
      description: 'One normalized event from an external agent run.


        ``kind`` and ``outcome`` together carry the epistemic weight.  A ``tool_result`` is

        direct evidence only when its outcome says the tool actually executed

        (``succeeded`` or ``failed``).  Missing, denied, interrupted or unknown outcomes are

        not Fact-grade evidence.'
    AssumptionItem:
      properties:
        id:
          type: string
          pattern: ^[FA]\d{3,}$
          title: Id
          description: 'Stable identity within a layer. The F/A prefix always matches the layer the item
            currently lives in, so crossing layers mints a new id: promoting A017 produces a new F-item
            carrying promoted_from=''A017''. An id is never reused, even after the item it named is removed
            or promoted away.'
        text:
          type: string
          title: Text
        evidence:
          items:
            type: string
          type: array
          title: Evidence
          description: Journal source IDs supporting this item.
        source_actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Actor
        tags:
          items:
            type: string
          type: array
          title: Tags
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated At
        promoted_from:
          anyOf:
          - type: string
          - type: 'null'
          title: Promoted From
          description: The id this item had in the other layer before a promotion or demotion. Follow
            the chain to reconstruct an item's epistemic history.
      additionalProperties: false
      type: object
      required:
      - id
      - text
      title: AssumptionItem
      description: Plausible and testable, but not yet sufficiently verified.
    ChallengeMeta:
      properties:
        id:
          type: string
          title: Id
        title:
          type: string
          title: Title
        category:
