# Generic fallback template.
#
# OWNERSHIP: Memory Core (Person 1) owns the template *schema*, the loader and the
# reclassification algorithm. The real per-category CTF technique catalogs are Person 3's
# deliverable. This file is a minimal fixture — do not grow it into a taxonomy here.
#
# Invariants enforced by memory_core/templates.py:
#   - fact_sections must contain 'general'
#   - assumption_sections must contain 'general'
#   - guessing technique ids are unique and stable within a template version
id: generic
version: 1
description: Generic CTF challenge with no category-specific layout.

classifier_hints: []

fact_sections:
  - target
  - artifacts
  - progress
  - general

assumption_sections:
  - attack_paths
  - next_checks
  - general

guessing:
  - id: GEN-ENUM
    title: Enumerate everything the challenge exposes
    tags: [recon]
    description: List files, ports, endpoints and metadata before forming a theory.
  - id: GEN-STRINGS
    title: Inspect raw content for embedded hints
    tags: [recon, artifacts]
    description: strings/xxd/exiftool style inspection of provided artifacts.
  - id: GEN-SOURCE
    title: Re-read the provided source or description carefully
    tags: [recon]
    description: Challenge text and source often state the intended bug directly.
